name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  database-authorization:
    name: Database authorization tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start isolated Supabase test stack
        run: supabase start

      - name: Test RLS and privileged database functions
        run: npm run test:db

  security:
    name: Secret scan, dependency audit and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan source for accidental secrets
        run: npm run security:check

      - name: Check security posture invariants
        run: npm run security:posture

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build production app
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
          SITE_URL: http://localhost:3000
        run: npm run build
